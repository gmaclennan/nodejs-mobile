name: Verify patches branch

# Integrity gate for the patches-only representation: reconstruct the full
# source tree from a real shallow clone of upstream nodejs/node at the pinned
# base, and fail unless the result hashes byte-for-byte to expected-tree.txt.
# Fast (no compilation): clone + git am + overlay + tree hash.
on:
  push:
    branches: [patches]
  pull_request:
    branches: [patches]
  workflow_dispatch:

# One run per PR/branch; a new PR commit supersedes the previous run. Pushes to
# patches are never cancelled — a release run must be allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct + verify
        run: scripts/prepare.sh out

      - name: Report
        if: always()
        run: |
          echo "base:     $(grep -Ev '^\s*(#|$)' upstream-base.txt | head -n1)"
          echo "expected: $(grep -Ev '^\s*(#|$)' expected-tree.txt | head -n1)"
          [ -d out ] && echo "got:      $(git -C out rev-parse 'HEAD^{tree}' 2>/dev/null || echo n/a)"

  # Review aid, not a gate: a PR to this branch is a diff *of a diff* — the
  # change to a .patch file, not the change to the source. Materialize the base
  # and the head of the PR and diff the two reconstructed trees, so a reviewer
  # can read the actual source change. Never fails the PR (the `verify` job
  # above is what gates); it only publishes the diff.
  #
  # An upgrade PR (one that moves upstream-base.txt) legitimately produces an
  # enormous diff — the whole upstream delta lands in it. The summary says so
  # rather than pretending the result is reviewable.
  tree-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # SKIP_VERIFY on both sides: this job reconstructs trees to compare them,
      # it does not re-gate the hash. `verify` owns that, and a base whose
      # expected-tree.txt has drifted must not block the reviewer's diff.
      - name: Materialize both sides
        run: |
          SKIP_VERIFY=1 base/scripts/prepare.sh "$RUNNER_TEMP/mat-base"
          SKIP_VERIFY=1 head/scripts/prepare.sh "$RUNNER_TEMP/mat-head"
          # Drop the per-tree git metadata so the diff is purely about content.
          rm -rf "$RUNNER_TEMP/mat-base/.git" "$RUNNER_TEMP/mat-head/.git"

      - name: Diff the reconstructed trees
        run: |
          cd "$RUNNER_TEMP"
          # --no-index exits 1 when the trees differ, which is the normal case.
          git diff --no-index --stat mat-base mat-head > tree-diff.stat || true
          git diff --no-index          mat-base mat-head > tree-diff.patch || true

          BB=$(grep -Ev '^\s*(#|$)' "$GITHUB_WORKSPACE/base/upstream-base.txt" | head -n1 | tr -d '[:space:]')
          HB=$(grep -Ev '^\s*(#|$)' "$GITHUB_WORKSPACE/head/upstream-base.txt" | head -n1 | tr -d '[:space:]')

          {
            echo "## Materialized source diff"
            echo
            if [ "$BB" != "$HB" ]; then
              echo "> **Upstream base moved: \`$BB\` → \`$HB\`.** This diff therefore"
              echo "> contains the entire upstream delta as well as the fork's changes."
              echo "> Review the patch/mobile-src diff in the Files tab instead; use this"
              echo "> only to confirm the fork-owned files came through the rebase."
              echo
            fi
            echo '```'
            # The stat can itself be huge on an upgrade; cap what goes inline.
            head -c 60000 tree-diff.stat
            echo '```'
            if [ "$(wc -c < tree-diff.stat)" -gt 60000 ]; then
              echo
              echo "_Summary truncated — see the \`materialized-tree-diff\` artifact for the full diff._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          ls -la tree-diff.stat tree-diff.patch

      - uses: actions/upload-artifact@v4
        with:
          name: materialized-tree-diff
          path: |
            ${{ runner.temp }}/tree-diff.stat
            ${{ runner.temp }}/tree-diff.patch

  # Per-patch build-system validation (successor to the retired
  # validate-patch-stack workflow on the materialized branch): apply the
  # series one patch at a time onto a clean upstream checkout and run
  # ./android-configure after each, so a broken intermediate patch is caught
  # even when a later patch happens to mask it at HEAD. Configure-only and
  # arm64-only for the same reasons the old workflow was (~1 min/patch;
  # nearly every historical patch regression surfaced at configure).
  patch-stack-configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: r27d
      ANDROID_TARGET_SDK_VERSION: '24'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # gyp-next needs setuptools at build time (distutils was removed from
      # the stdlib).
      - name: Install Python build deps
        run: |
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install setuptools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Apply each patch and configure
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          BASE=$(grep -Ev '^\s*(#|$)' upstream-base.txt | head -n1 | tr -d '[:space:]')
          git clone --depth 1 --branch "$BASE" https://github.com/nodejs/node.git src
          git -C src config user.name ci
          git -C src config user.email ci@invalid
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in \#*) continue ;; esac
            git -C src am --3way --keep-cr --whitespace=nowarn "$PWD/patches/$p"
            echo "::group::configure after $p"
            ( cd src && ./android-configure "${MY_ANDROID_NDK_HOME}" "${ANDROID_TARGET_SDK_VERSION}" arm64 )
            # Drop configure outputs so the next patch applies to a clean tree.
            git -C src clean -qfdx -e .git
            git -C src checkout -q -- .
            echo "::endgroup::"
          done < patches/series
          echo "All patches configure-validate individually."
