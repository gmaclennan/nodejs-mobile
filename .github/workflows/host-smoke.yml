# Host build + JS test suite: builds Node natively on the runner (no
# cross-compile) and runs the upstream JS tests against it. This is the PR
# boundary's fastest real signal — the patch stack touches lib/ and src/, and a
# host runner can execute the suite with no emulator, simulator or device in
# the loop. It does NOT prove anything mobile-specific (no cross-compile, no
# on-device loader); build.yml owns that.
#
# Builds only the 'node' target with -j, so no cctest/addons are produced.

name: Host smoke

on:
  push:
    branches: [patches]
  pull_request:
    branches: [patches]
  workflow_dispatch:

# One run per PR/branch; a new PR commit supersedes the previous run. Pushes to
# patches are never cancelled — a release run must be allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke-host:
    runs-on: ubuntu-24.04
    # Nothing wires a compiler cache into this build, so every run compiles V8
    # from cold: ~75-85 min on a 4-core runner before a single test executes,
    # then ~30 min for the suites below. 180 leaves real headroom while still
    # catching a genuine hang, which the 360-minute default never would.
    # Wiring up sccache here (build.yml installs it, but nothing sets the
    # compiler wrapper) would cut this a lot and is worth doing separately.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/materialize

      # gyp-next needs setuptools at build time and a bare venv doesn't bundle
      # it (distutils was removed from the stdlib); install it explicitly.
      - name: Configure
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./configure

      - name: Build node target
        run: |
          source bin/activate
          make -j"$(nproc)" node

      - name: Smoke test
        run: |
          ./out/Release/node -e "console.log(process.versions); process.exit(0)"

      # The iOS binary runs V8 jitless, and a jitless V8 exposes no
      # WebAssembly -- which is why the library bundles the polywasm polyfill
      # (deps/polywasm, installed by lib/internal/process/pre_execution.js):
      # without it undici's llhttp can't load and fetch() is dead. Passing
      # --jitless to the host build reproduces that engine exactly, so this
      # gates the polyfill on every push instead of only on device runs.
      # See docs/TESTING.md, "The fetch / WebAssembly gate".
      # NODEJS_MOBILE_EXPECT_WASM_IMPL makes the test assert which
      # implementation it actually ran on, so this stays a real gate: if a
      # future V8 kept WebAssembly under --jitless, or the install stopped
      # firing, the step fails instead of quietly testing the wrong path.
      - name: fetch/WebAssembly gate (jitless, polyfill path)
        env:
          NODEJS_MOBILE_EXPECT_WASM_IMPL: polyfill
        run: |
          ./out/Release/node --jitless test/parallel/test-mobile-fetch.js

      - name: fetch/WebAssembly gate (V8's own WebAssembly)
        env:
          NODEJS_MOBILE_EXPECT_WASM_IMPL: engine
        run: |
          ./out/Release/node test/parallel/test-mobile-fetch.js

      # The same curated list the Tier-2 mobile workflows run, executed on the
      # host build. Everything in it is an upstream test that passes on mobile,
      # so it passes on a host build too unless a patch actually broke it —
      # which makes this a zero-flake blocking check that catches lib/ and
      # src/ regressions minutes into a PR instead of at the Tier-2 stage.
      - name: Run the curated Tier-2 list on the host build
        run: |
          source bin/activate
          grep -vE '^[[:space:]]*#|^[[:space:]]*$' tools/mobile-test/tier2-parallel-tests.txt \
            | xargs ./tools/test.py -j "$(nproc)" --flaky-tests=skip

      # The full parallel suite is far broader than the curated list and is the
      # real prize here. It is advisory for now: `make node` alone doesn't build
      # cctest or the addon fixtures, so a handful of cases may need extra
      # targets or a skip list. Promote to blocking (drop continue-on-error)
      # once a few runs confirm the pass-set — see docs/TESTING.md.
      - name: Run the full parallel suite on the host build (advisory)
        continue-on-error: true
        run: |
          source bin/activate
          ./tools/test.py -j "$(nproc)" --flaky-tests=skip parallel
