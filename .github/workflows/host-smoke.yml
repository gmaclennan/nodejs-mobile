# Host build + JS test suite: builds Node natively on the runner (no
# cross-compile) and runs the upstream JS tests against it. This is the PR
# boundary's fastest real signal — the patch stack touches lib/ and src/, and a
# host runner can execute the suite with no emulator, simulator or device in
# the loop. It does NOT prove anything mobile-specific (no cross-compile, no
# on-device loader); build.yml owns that.
#
# Builds only the 'node' target with -j, so no cctest/addons are produced.

name: Host smoke

on:
  push:
    branches: [patches]
  pull_request:
    branches: [patches]
  workflow_dispatch:

# One run per PR/branch; a new PR commit supersedes the previous run. Pushes to
# patches are never cancelled — a release run must be allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # No SCCACHE_GHA_ENABLED: the backend is R2, set per compiling step below.
  # ghac outranks s3 in sccache's backend precedence, so leaving the flag set
  # would silently send writes back to the rate-limited Actions cache. See the
  # long note on build.yml's build-android sccache stats step.
  SCCACHE_IDLE_TIMEOUT: '0'   # keep the sccache server alive through long builds
  SCCACHE_LOG: warn
  SCCACHE_ERROR_LOG: /tmp/sccache-errors.log

jobs:
  smoke-host:
    runs-on: ubuntu-24.04
    # Measured at 82 min end to end with no compiler cache at all: ~75 of that
    # was V8, before a single test executed. sccache is wired below now, so a
    # warm run should be far shorter — but the cold number is what the timeout
    # has to survive, and a cache miss still pays it. 180 leaves real headroom
    # while still catching a genuine hang, which the 360-minute default never
    # would.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/materialize

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # The fork wraps the compiler in sccache from android_configure.py, but
      # only there — configure.py carries no such wiring, so the host build
      # (and the iOS build, which also goes through configure.py) compiled V8
      # cold on every single run: ~75 min before a test could start. Set the
      # wrapper here instead, which node's configure honours the same way it
      # honours CC="ccache gcc". CC_host/CXX_host matter because gyp builds
      # host tools (mksnapshot, torque) with those.
      #
      # gyp-next needs setuptools at build time and a bare venv doesn't bundle
      # it (distutils was removed from the stdlib); install it explicitly.
      #
      # The R2 backend has to be set here as well as on the build step, not just
      # on the build: ./configure runs compiler checks, so the sccache server is
      # spawned during Configure and keeps whatever backend config it started
      # with. Setting it only on the build step would leave the server already
      # running with no backend and cache nothing.
      - name: Configure
        env:
          CC: sccache cc
          CXX: sccache c++
          CC_host: sccache cc
          CXX_host: sccache c++
          SCCACHE_BUCKET: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_BUCKET || '' }}
          SCCACHE_REGION: auto
          SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./configure

      - name: Build node target
        env:
          CC: sccache cc
          CXX: sccache c++
          CC_host: sccache cc
          CXX_host: sccache c++
          SCCACHE_BUCKET: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_BUCKET || '' }}
          SCCACHE_REGION: auto
          SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          source bin/activate
          make -j"$(nproc)" node

      # Always print the stats: this is the only way the cache's effectiveness
      # is visible at all. build-android has had this step, and it is what
      # exposed the near-total write failure that moved this build off the
      # GitHub Actions cache backend and onto R2.
      - name: sccache stats
        if: always()
        run: |
          sccache --show-stats || true
          # The counters above say how many writes failed; this says why.
          if [ -s /tmp/sccache-errors.log ]; then
            echo '--- sccache server log (unique messages) ---'
            sort /tmp/sccache-errors.log | uniq -c | sort -rn | head -40
          fi

      - name: Smoke test
        run: |
          ./out/Release/node -e "console.log(process.versions); process.exit(0)"

      # The iOS binary runs V8 jitless, and a jitless V8 exposes no
      # WebAssembly -- which is why the library bundles the polywasm polyfill
      # (deps/polywasm, installed by lib/internal/process/pre_execution.js):
      # without it undici's llhttp can't load and fetch() is dead. Passing
      # --jitless to the host build reproduces that engine exactly, so this
      # gates the polyfill on every push instead of only on device runs.
      # See docs/TESTING.md, "The fetch / WebAssembly gate".
      # NODEJS_MOBILE_EXPECT_WASM_IMPL makes the test assert which
      # implementation it actually ran on, so this stays a real gate: if a
      # future V8 kept WebAssembly under --jitless, or the install stopped
      # firing, the step fails instead of quietly testing the wrong path.
      - name: fetch/WebAssembly gate (jitless, polyfill path)
        env:
          NODEJS_MOBILE_EXPECT_WASM_IMPL: polyfill
        run: |
          ./out/Release/node --jitless test/parallel/test-mobile-fetch.js

      - name: fetch/WebAssembly gate (V8's own WebAssembly)
        env:
          NODEJS_MOBILE_EXPECT_WASM_IMPL: engine
        run: |
          ./out/Release/node test/parallel/test-mobile-fetch.js

      # --frozen-intrinsics is the one caller that inspects the polyfill's
      # *shape* instead of just calling it: internal/freeze_intrinsics.js reads
      # seven WebAssembly.*.prototype values as soon as the global exists, so a
      # member polywasm doesn't implement doesn't break fetch() -- it stops the
      # runtime from booting. That is how the missing LinkError/RuntimeError
      # were found. Cheap to keep, and the only gate that covers it: the full
      # parallel suite below is advisory, and mobile .status skips this test.
      # See docs/TESTING.md, "The fetch / WebAssembly gate".
      - name: frozen-intrinsics gate (jitless, polyfill path)
        run: |
          ./out/Release/node --jitless --frozen-intrinsics \
            test/parallel/test-freeze-intrinsics.js

      # The same curated list the Tier-2 mobile workflows run, executed on the
      # host build. Everything in it is an upstream test that passes on mobile,
      # so it passes on a host build too unless a patch actually broke it —
      # which makes this a zero-flake blocking check that catches lib/ and
      # src/ regressions minutes into a PR instead of at the Tier-2 stage.
      - name: Run the curated Tier-2 list on the host build
        run: |
          source bin/activate
          # pipefail + count guard: a missing/emptied list must fail loudly,
          # not run the wrong suite (GNU xargs) or nothing (BSD xargs).
          set -o pipefail
          COUNT=$(grep -cvE '^[[:space:]]*#|^[[:space:]]*$' tools/mobile-test/tier2-parallel-tests.txt)
          [ "$COUNT" -ge 100 ] || { echo "::error::curated list missing or implausibly small ($COUNT entries)"; exit 1; }
          grep -vE '^[[:space:]]*#|^[[:space:]]*$' tools/mobile-test/tier2-parallel-tests.txt \
            | xargs ./tools/test.py -j "$(nproc)" --flaky-tests=skip

      # The full parallel suite is far broader than the curated list and is the
      # real prize here. It is advisory for now: `make node` alone doesn't build
      # cctest or the addon fixtures, so a handful of cases may need extra
      # targets or a skip list. Promote to blocking (drop continue-on-error)
      # once a few runs confirm the pass-set — see docs/TESTING.md.
      - name: Run the full parallel suite on the host build (advisory)
        continue-on-error: true
        run: |
          source bin/activate
          ./tools/test.py -j "$(nproc)" --flaky-tests=skip parallel
