name: Cache credentials

# Assert that the two R2 tokens behind the shared compiler cache still are what
# build.yml assumes: `sccache-read` can read and CANNOT write, `sccache-write`
# can do both. See docs/BUILDING.md, "The CI compiler cache".
#
# This is a scheduled workflow and not a step in build.yml because of two reasons:
#
#   1. A job holds exactly one Environment, so a build.yml job can only ever reach
#      one of the two tokens: a PR gets `sccache-read`, a push to `recipe` gets
#      `sccache-write`. No single run of build.yml can test both halves. Only a run
#      on `recipe` that is free to declare either environment can cover all four
#      assertions in one place, which is what this is.
#   2. The shape of the failures. None of them break the build that hits them:
#      - read token revoked/expired  -> every build silently drops to 0% hits and
#                                       gets slow. Correct, just expensive.
#      - write token revoked/expired -> writes silently fail, the cache goes stale
#                                       and never recovers.
#      - read token silently granted write -> no functional symptom AT ALL, ever.
#        The security property is gone and nothing observable changes.

on:
  schedule:
    # Daily. Nothing here races a build; the probe keys are unique per run.
    - cron: '17 6 * * *'
  # Run this by hand right after changing either token or either Environment —
  # that is the moment the answer actually matters.
  #
  # Dispatching it from a ref OTHER than `recipe` is also the one practical way
  # to exercise the deployment branch rule: `probe-write` is then refused by
  # GitHub before it starts, and a failed `probe-write` with no logs IS the
  # rule working. The scheduled run cannot test that, because a schedule always
  # runs on the default branch, where the rule passes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-credentials
  cancel-in-progress: false

env:
  SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
  SCCACHE_REGION: auto
  SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # Forced READ_WRITE in BOTH jobs, deliberately overriding the value build.yml
  # uses off `recipe`. That setting makes sccache refuse writes locally, which
  # would mask the exact failure this workflow exists to catch: a refusal that
  # never leaves the runner tells you nothing about the token.
  SCCACHE_S3_RW_MODE: READ_WRITE
  SCCACHE_LOG: warn
  SCCACHE_ERROR_LOG: /tmp/sccache-errors.log
  SCCACHE_IDLE_TIMEOUT: '0'

jobs:
  # Expected: reads reach R2 and authenticate (a miss comes back 404, not 403);
  # the write that follows is refused by Cloudflare with a 403.
  probe-read:
    runs-on: ubuntu-24.04
    environment:
      name: sccache-read
      deployment: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      # No checkout: this compiles one generated file and needs nothing from
      # the tree.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe
        run: | #shell
          set -euo pipefail
          # The identifier must be unique per run AND per job.
          #
          # Per run, so the key is fresh and the compile is guaranteed to
          # miss. The miss is the whole method here: it forces a real GET
          # (read auth, proved by the 404 that comes back) and then a real
          # PUT (write auth, or the refusal of it).
          #
          # Per job, because probe-write compiles in parallel with this and
          # the run id alone is identical in both. An identical source there
          # stores an object under this very key, whichever job gets there
          # first — turning this miss into a hit, skipping the write, and
          # proving nothing about the token.
          printf 'int probe_read_%s_%s(void){return 0;}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > probe.c
          sccache cc -c probe.c -o probe.o
          sccache --show-stats --stats-format=json > stats.json
          sccache --show-stats
          echo '--- sccache server log ---'
          cat /tmp/sccache-errors.log || true

          fail() { echo "::error::$*"; exit 1; }

          loc=$(jq -r .cache_location stats.json)
          case "$loc" in
            s3*) echo "backend: $loc" ;;
            # No credentials at all: sccache falls back to local disk and every
            # assertion below would pass vacuously.
            *) fail "sccache is not using R2 ($loc) — are the sccache-read secrets set?" ;;
          esac

          # Reads: a 404 for a key that does not exist means the request was
          # authenticated. An auth failure would surface as a read error here.
          [ "$(jq -r .stats.cache_read_errors stats.json)" = 0 ] \
            || fail "read errors against R2 — the read token looks revoked or expired"
          [ "$(jq -r '[.stats.cache_misses.counts[]] | add // 0' stats.json)" = 1 ] \
            || fail "expected exactly one cache miss from the probe compile"

          # Writes: must be refused, and refused BY CLOUDFLARE.
          [ "$(jq -r .stats.cache_writes stats.json)" = 0 ] \
            || fail "the sccache-read token WROTE to the cache — it is not read-only. Reissue it as R2 'Object Read only'."
          [ "$(jq -r .stats.cache_write_errors stats.json)" -ge 1 ] \
            || fail "no write was attempted, so nothing was proven — did SCCACHE_S3_RW_MODE get overridden?"

          # The token evidence. Two reasons this is looser than it looks:
          #
          #   - The denial arrives on `.sccache_check`, not on the probe's own
          #     object. sccache write-checks the bucket when the server starts,
          #     so a read-only credential is refused there first and may never
          #     attempt to store the object at all.
          #   - opendal words a write failure "write close failed" when the
          #     write was streamed and "write failed" when it wasn't, and
          #     sccache adds "storage write check failed" of its own. Any of
          #     the three is the same finding.
          #
          # So: match any write-path denial, then check the status separately.
          if ! grep -Eq 'write( close)? failed|storage write check failed' \
                 /tmp/sccache-errors.log 2>/dev/null; then
            fail "no write to R2 was refused — nothing here proves the token is read-only"
          fi
          grep -Eq 'AccessDenied|status: 403' /tmp/sccache-errors.log \
            || fail "a write was refused, but not with 403/AccessDenied — inconclusive, look at the server log above"

          echo "OK: sccache-read reads R2 and is refused write with 403 AccessDenied"

  # Expected: the write lands, and reading it back in a fresh server returns it
  # — which is what distinguishes a write that succeeded from one that was
  # merely reported as succeeding.
  probe-write:
    runs-on: ubuntu-24.04
    environment:
      name: sccache-write
      deployment: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe
        run: | #shell
          set -euo pipefail
          # Deliberately not the same identifier probe-read uses — the two
          # jobs run in parallel and would otherwise share a cache key. See
          # the note there.
          printf 'int probe_write_%s_%s(void){return 0;}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > probe.c

          fail() { echo "::error::$*"; exit 1; }

          sccache cc -c probe.c -o probe.o
          sccache --show-stats --stats-format=json > write.json
          sccache --show-stats

          loc=$(jq -r .cache_location write.json)
          case "$loc" in
            s3*) echo "backend: $loc" ;;
            *) fail "sccache is not using R2 ($loc) — are the sccache-write secrets set?" ;;
          esac
          [ "$(jq -r .stats.cache_writes write.json)" = 1 ] \
            || fail "the sccache-write token did not write. The cache will go stale silently: reissue it as R2 'Object Read & Write'."
          [ "$(jq -r .stats.cache_write_errors write.json)" = 0 ] \
            || { cat /tmp/sccache-errors.log || true; fail "write errors against R2"; }

          # Fresh server so the read-back is a real GET against R2 (stats are
          # per-server, so this also resets the counters).
          sccache --stop-server >/dev/null
          rm -f /tmp/sccache-errors.log probe.o
          sccache cc -c probe.c -o probe.o
          sccache --show-stats --stats-format=json > read.json
          sccache --show-stats
          [ "$(jq -r '[.stats.cache_hits.counts[]] | add // 0' read.json)" = 1 ] \
            || { cat /tmp/sccache-errors.log || true; fail "the object just written did not read back — the write was not durable"; }

          echo "OK: sccache-write wrote to R2 and read the object back"
